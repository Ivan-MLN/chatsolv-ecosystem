services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: chatsolv}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres -d chatsolv"], interval: 5s, timeout: 3s, retries: 10}
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --save "" --appendonly no
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: chatsolv
      MINIO_ROOT_PASSWORD: chatsolv-development-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck: {test: ["CMD", "mc", "ready", "local"], interval: 5s, timeout: 3s, retries: 10}
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 chatsolv chatsolv-development-secret && mc mb --ignore-existing local/chatsolv-originals"]
  mock-whatsapp:
    image: node:22-alpine
    working_dir: /app
    command: node server.mjs
    volumes: ["./mock/whatsapp:/app:ro"]
    environment:
      PORT: 4010
      BACKEND_INTERNAL_URL: http://host.docker.internal:3000/internal/v1
      INTERNAL_SERVICE_SECRET: replace-with-at-least-32-random-bytes
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["4010:4010"]
  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chatsolv?sslmode=disable
      REDIS_URL: redis://redis:6379
    ports: ["3000:3000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes: {pgdata: {}, miniodata: {}}
